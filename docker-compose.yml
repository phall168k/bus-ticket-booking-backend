      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
    restart: unless-stopped

# ==================
# Volumes
# ==================
volumes:
  postgres_auth_data:
  postgres_trip_data:
  postgres_booking_data:
  postgres_payment_data:
  postgres_notification_data:

# ==================
# Networks
# ==================
networks:
  backend-network:
    driver: bridge
