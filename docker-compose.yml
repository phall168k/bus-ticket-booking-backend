      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USERNAME} -d ${DB_BOOKING_NAME}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
    restart: unless-stopped
  
  # Payment Database
  postgres-payment:
    image: postgres:16-alpine
    container_name: payment_db
    env_file:
      - .env
