services:

# ==================
# Databases
# ==================
  # Auth Database
  postgres_auth:
    image: postgres:16-alpine
    container_name: auth_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_AUTH_NAME}
    ports:
      - '${DB_AUTH_PORT}:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_AUTH_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
    restart: unless-stopped

  # Trip Database
  postgres_trip:
