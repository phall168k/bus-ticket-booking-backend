      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_PAYMENT_NAME}
    ports:
      - '${DB_PAYMENT_PORT}:5432'
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USERNAME} -d ${DB_PAYMENT_NAME}"
