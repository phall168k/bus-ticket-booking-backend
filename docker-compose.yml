      POSTGRES_DB: ${DB_TRIP_NAME}
    ports:
      - '${DB_TRIP_PORT}:5432'
    volumes:
      - postgres_trip_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_TRIP_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
    restart: unless-stopped

  # Booking Database
